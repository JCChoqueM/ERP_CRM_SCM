<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Demo CRM · ERP · SCM — Zapatos Sol</title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        --bg: #f4f5fa;
        --cd: #fff;
        --tx: #1b1e2b;
        --mu: #5b6075;
        --bd: #e0e3ee;
        --crm: #2563eb;
        --mkt: #db2777;
        --scm: #c2410c;
        --erp: #0f766e;
        --ok: #15803d;
        --wr: #b45309;
        --rd: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1120;
          --cd: #181c2f;
          --tx: #eef0f8;
          --mu: #a3a9c4;
          --bd: #2a3050;
          --crm: #60a5fa;
          --mkt: #f472b6;
          --scm: #fb923c;
          --erp: #2dd4bf;
          --ok: #4ade80;
          --wr: #fbbf24;
          --rd: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .w {
        max-width: none;
        margin: 0;
        padding: 14px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      .mu,
      small {
        color: var(--mu);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      nav {
        display: grid;
        grid-template-columns: max-content max-content repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin: 0 0 8px;
      }
      /* Una fila: Bitácora y Marketing ajustados a su texto · CRM, ERP, SCM ocupan el resto */
      nav button[data-t=home] { grid-column: 1; grid-row: 1; }
      nav button[data-t=mkt] { grid-column: 2; grid-row: 1; }
      .b.lk { cursor: pointer; }
      .b.lk:hover, .b.lk:focus-visible { filter: brightness(1.25); text-decoration: underline; }
      nav button[data-t=crm] { grid-column: 3; grid-row: 1; }
      nav button[data-t=erp] { grid-column: 4; grid-row: 1; }
      nav button[data-t=scm] { grid-column: 5; grid-row: 1; }
      nav button {
        border: 1px solid var(--bd);
        background: var(--cd);
        color: var(--tx);
        border-radius: 99px;
        padding: 8px 16px;
        font-size: 14px;
        min-width: 0;
        text-align: left;
        white-space: nowrap;
      }
      nav button.on {
        background: var(--tx);
        color: var(--bg);
        font-weight: 700;
      }
      /* Colores por sector: CRM azul · ERP verde azulado · SCM naranja */
      nav button[data-t=crm] { --c: var(--crm); }
      nav button[data-t=erp] { --c: var(--erp); }
      nav button[data-t=scm] { --c: var(--scm); }
      /* Inactivas: discretas (borde fino del color del sector, sin relleno) */
      nav button[data-t=crm], nav button[data-t=erp], nav button[data-t=scm] {
        border: 1px solid color-mix(in srgb, var(--c) 45%, var(--bd));
        background: var(--cd);
        color: color-mix(in srgb, var(--tx) 75%, transparent);
      }
      nav button[data-t=home], nav button[data-t=mkt] { color: color-mix(in srgb, var(--tx) 75%, transparent); }
      /* Activa: relleno sólido + anillo exterior + marca ● para que se vea claro dónde estás */
      nav button.on,
      nav button[data-t=crm].on, nav button[data-t=erp].on, nav button[data-t=scm].on {
        background: var(--c, var(--tx));
        border-color: var(--c, var(--tx));
        color: #fff;
        font-weight: 800;
        box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c, var(--tx));
        opacity: 1;
      }
      nav button.on::before { content: "● "; font-size: 10px; vertical-align: 2px; }
      @media (prefers-color-scheme: dark) {
        nav button.on,
        nav button[data-t=crm].on, nav button[data-t=erp].on, nav button[data-t=scm].on { color: #0e1120; }
      }
      .c {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .c h2 {
        margin: 0 0 6px;
        font-size: 18px;
      }
      .c h3 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .c p {
        margin: 4px 0;
      }
      .c.crm {
        border-top: 5px solid var(--crm);
      }
      .c.erp {
        border-top: 5px solid var(--erp);
      }
      .c.scm {
        border-top: 5px solid var(--scm);
      }
      .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .hd h3 {
        margin: 0;
      }
      .stk {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        margin: 0 -14px 12px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--bd);
      }
      .kp {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        gap: 8px;
        padding-bottom: 2px;
      }
      .k {
        background: color-mix(in srgb, var(--c) 13%, var(--cd));
        border: 1px solid color-mix(in srgb, var(--c) 50%, var(--bd));
        border-left: 7px solid var(--c);
        border-radius: 12px;
        padding: 7px 10px;
        min-width: 0;
        box-shadow: 0 2px 8px color-mix(in srgb, var(--c) 22%, transparent);
      }
      .k b { color: var(--c); }
      .k small {
        display: block;
        font-size: 12px;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .k b {
        display: block;
        font-size: 17px;
        white-space: nowrap;
      }
      .k.crm {
        --c: var(--crm);
      }
      .k.erp {
        --c: var(--erp);
      }
      .k.scm {
        --c: var(--scm);
      }
      .kb {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
        gap: 10px;
      }
      .col {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px;
      }
      .col h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--crm);
      }
      .cd {
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 8px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .cd b {
        font-size: 14px;
      }
      /* Tablero CRM: columnas por etapa, tarjetas por color de producto */
      .col.s0 { --sc: var(--crm); } .col.s1 { --sc: var(--wr); } .col.s2 { --sc: #a855f7; } .col.s3 { --sc: var(--ok); } .col.s4 { --sc: var(--rd); }
      .col[class*=" s"] {
        background: color-mix(in srgb, var(--sc) 7%, var(--cd));
        border: 1px solid color-mix(in srgb, var(--sc) 40%, var(--bd));
        border-top: 5px solid var(--sc);
      }
      .col[class*=" s"] h3 { color: var(--sc); font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .col[class*=" s"] h3 .cn { background: var(--sc); color: var(--cd); border-radius: 99px; padding: 0 9px; font-size: 13px; font-weight: 800; }
      .cd[id^="l-"] {
        border-left: 7px solid var(--pc, var(--bd));
        border-color: color-mix(in srgb, var(--pc, var(--bd)) 45%, var(--bd));
        border-left-color: var(--pc, var(--bd));
        background: color-mix(in srgb, var(--pc, var(--cd)) 12%, var(--cd));
        box-shadow: 0 2px 8px color-mix(in srgb, var(--pc, #000) 20%, transparent);
      }
      .cd[id^="l-"] > b:first-of-type { font-size: 15px; }
      .cd > button {
        margin-top: 6px;
        width: 100%;
      }
      .ic {
        display: flex;
        gap: 4px;
        margin-top: 6px;
      }
      .ic button {
        flex: 1;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th,
      td {
        border-bottom: 1px solid var(--bd);
        padding: 7px 8px;
        text-align: left;
        white-space: nowrap;
      }
      th {
        color: var(--mu);
      }
      .b {
        border-radius: 99px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 700;
      }
      .b.w {
        background: #f59e0b33;
        color: var(--wr);
      }
      .b.o {
        background: #22c55e33;
        color: var(--ok);
      }
      button:not(nav button) {
        background: var(--tx);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      button.gh {
        background: transparent;
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      button.sm {
        padding: 3px 8px;
        font-size: 12px;
        margin-right: 4px;
      }
      .fm {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .al {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        border: 1px solid var(--wr);
        border-radius: 10px;
        padding: 8px 10px;
        margin-bottom: 8px;
      }
      .pt {
        display: inline-block;
        border-left: 4px solid var(--pc);
        background: color-mix(in srgb, var(--pc) 18%, transparent);
        padding: 0 7px;
        border-radius: 6px;
        font-weight: 600;
      }
      .b.r {
        background: #ef444433;
        color: var(--rd);
      }
      .al.r {
        border-color: var(--rd);
      }
      .al small {
        display: block;
      }
      .al .bt {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      [id^='s-'],
      [id^='l-'],
      [id^='r-'] {
        scroll-margin-top: 150px;
      }
      .fl {
        animation: fl 2.6s ease-out;
        position: relative;
        z-index: 2;
      }
      tr.fl-r td {
        animation: flr 2.6s;
      }
      @keyframes flr {
        0%,
        75% {
          background: color-mix(in srgb, var(--wr) 45%, transparent);
        }
        100% {
          background: transparent;
        }
      }
      @keyframes fl {
        0%, 65% { box-shadow: 0 0 0 4px #facc15, inset 0 0 0 999px #facc1538; }
        80% { box-shadow: 0 0 0 3px #facc1599, inset 0 0 0 999px #facc1522; }
        100% { box-shadow: 0 0 0 0 transparent, inset 0 0 0 999px transparent; }
      }
      .wn {
        border: 1px solid var(--wr);
        background: #f59e0b1f;
        border-radius: 8px;
        padding: 6px 8px;
        margin-top: 6px;
        font-size: 12px;
      }
      .wn.ok,
      .al.ok {
        border-color: var(--ok);
        background: #22c55e1f;
      }
      .nvb {
        display: inline-block;
        background: var(--ok);
        color: var(--bg);
        border-radius: 6px;
        padding: 0 5px;
        font-size: 11px;
        font-weight: 800;
        margin-right: 4px;
      }
      tr.nv td {
        background: color-mix(in srgb, var(--ok) 13%, transparent);
      }
      tr.nv td:first-child {
        box-shadow: inset 4px 0 0 var(--ok);
      }
      .cd.nv,
      .al.nv {
        box-shadow: 0 0 0 2px var(--ok);
      }
      .flash:not(tr) {
        animation: fl 2.6s ease-out;
      }
      tr.flash td {
        animation: flr 2.6s;
      }
      .al.nvh {
        position: fixed;
        top: var(--nvtop, 120px);
        left: 50%;
        transform: translateX(-50%);
        width: min(1072px, calc(100vw - 20px));
        z-index: 6;
        margin: 0;
        padding: 7px 10px;
        border-color: var(--ok);
        background: color-mix(in srgb, var(--ok) 18%, var(--bg));
        box-shadow: 0 4px 16px #0008, 0 0 0 1px var(--ok);
        cursor: pointer;
        flex-wrap: nowrap;
      }
      .nvsp {
        height: var(--nvh, 52px);
      }
      .al.nvh:hover {
        background: color-mix(in srgb, var(--ok) 26%, var(--bg));
      }
      .al.nvh > span {
        min-width: 0;
      }
      .al.nvh small {
        display: inline;
        margin-left: 6px;
        opacity: 0.8;
      }
      .nvch { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
      .nvr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .nvw { font-size: 13px; color: var(--tx); opacity: .9; flex: 1 1 260px; min-width: 0; }
      .why { background: color-mix(in srgb, var(--ok) 16%, transparent); border-left: 3px solid var(--ok); border-radius: 6px; padding: 4px 8px; margin: 4px 0; font-size: 12.5px; }
      .nvch .cp { border: 1px solid var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--cd)); color: var(--tx); border-radius: 99px; padding: 3px 11px; font-size: 13px; font-weight: 600; }
      .nvch .cp:hover { background: color-mix(in srgb, var(--ok) 30%, var(--cd)); }
      .nvch .cp.on { background: var(--ok); color: #fff; box-shadow: 0 0 10px var(--ok); }
      .al.nvh .bt {
        flex-wrap: nowrap;
        flex: none;
      }
      .nvh .nvc {
        font-weight: 800;
        color: var(--ok);
        margin-left: 4px;
      }
      .nv.nvcur {
        outline: 3px solid var(--ok);
        outline-offset: 2px;
        border-radius: 8px;
        animation: nvp 1.2s ease-out 2;
        position: relative;
        z-index: 2;
      }
      @keyframes nvp {
        0%, 100% { outline-color: var(--ok); }
        50% { outline-color: color-mix(in srgb, var(--ok) 35%, transparent); }
      }
      tr.nv.nvcur td {
        background: color-mix(in srgb, var(--ok) 30%, transparent);
      }
      @media (max-width: 640px) {
        .al.nvh {
          flex-wrap: wrap;
        }
        .al.nvh small {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
      .tl {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin: 0 0 10px;
      }
      .tl input,
      .tl select {
        width: auto;
        margin: 0;
        padding: 6px 10px;
        font-size: 13px;
        flex: 0 1 auto;
      }
      .tl input {
        min-width: 190px;
        flex: 1 1 190px;
      }
      .c.tlc {
        padding: 10px 14px 0;
        margin-bottom: 10px;
      }
      button.ch {
        background: transparent;
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 99px;
        padding: 4px 11px;
        font-size: 12px;
        font-weight: 600;
      }
      button.ch b {
        opacity: 0.7;
        margin-left: 2px;
      }
      button.ch.on {
        background: var(--tx);
        color: var(--bg);
      }
      .al[onclick] {
        cursor: pointer;
      }
      .nb {
        background: var(--ok);
        color: var(--bg);
        border-radius: 99px;
        padding: 0 7px;
        font-size: 12px;
        font-weight: 800;
        margin-left: 4px;
      }
      .wn button {
        margin-top: 6px;
        width: 100%;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .b.i {
        background: #3b82f633;
        color: var(--crm);
      }
      .ks {
        display: block;
        font-size: 11px;
        color: var(--mu);
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .nw {
        display: none;
        border-left: 3px solid var(--erp);
        padding-left: 8px;
        margin-top: 4px;
      }
      .lg {
        display: flex;
        gap: 8px;
        padding: 6px 0 6px 8px;
        border-bottom: 1px solid var(--bd);
        border-left: 4px solid var(--c);
        font-size: 13px;
      }
      .lg i {
        font-style: normal;
        color: var(--mu);
        flex: none;
      }
      .lg.crm {
        --c: var(--crm);
      }
      .lg.erp {
        --c: var(--erp);
      }
      .lg.scm {
        --c: var(--scm);
      }
      ol {
        margin: 6px 0;
        padding-left: 20px;
      }
      li {
        margin: 4px 0;
      }
      dialog {
        border: 1px solid var(--bd);
        border-radius: 14px;
        background: var(--cd);
        color: var(--tx);
        padding: 16px;
        width: min(420px, 92vw);
      }
      dialog::backdrop {
        background: #0008;
      }
      dialog h3 {
        margin: 0 0 6px;
      }
      label {
        display: block;
        margin: 8px 0;
        font-size: 13px;
        color: var(--mu);
      }
      input,
      select {
        font: inherit;
        display: block;
        width: 100%;
        margin-top: 3px;
        padding: 8px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--bg);
        color: var(--tx);
      }
      .ac {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .cmp .cpv { margin: 12px 0; padding: 12px 14px; background: color-mix(in srgb, var(--mc) 14%, var(--cd)); border: 1px solid color-mix(in srgb, var(--mc) 55%, transparent); border-left: 6px solid var(--mc); border-radius: 12px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
      .cmp .cpv small { display: block; color: var(--mc); font-weight: 700; font-size: 12px; margin-bottom: 6px; white-space: normal; }
      #bq .bm { flex-basis: 100%; padding: 8px 10px; border-left: 5px solid var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--cd)); border-radius: 8px; font-size: 13px; white-space: pre-wrap; max-height: 96px; overflow: auto; }
      .nm { cursor: help; border-bottom: 1px dotted var(--mu); }
      #mtip { position: fixed; z-index: 80; display: none; max-width: min(420px, calc(100vw - 24px)); padding: 10px 12px; background: var(--cd); color: var(--tx); border: 2px solid var(--ok); border-left: 6px solid var(--ok); border-radius: 12px; box-shadow: 0 8px 30px #0007; font-size: 14px; line-height: 1.45; white-space: pre-wrap; pointer-events: none; }
      #mtip b { display: block; color: var(--ok); font-size: 12px; margin-bottom: 4px; }
      #tr-hl { position: fixed; z-index: 90; border: 3px solid #fbbf24; border-radius: 12px; box-shadow: 0 0 0 9999px #000a; pointer-events: none; transition: all .25s ease; }
      #tr-cd { position: fixed; z-index: 91; width: min(380px, calc(100vw - 24px)); padding: 16px; background: var(--cd); color: var(--tx); border: 2px solid #fbbf24; border-radius: 16px; box-shadow: 0 12px 40px #000a; font-size: 14px; line-height: 1.5; }
      #tr-cd h3 { margin: 0 0 6px; font-size: 17px; }
      #tr-cd p { margin: 0 0 8px; }
      #tr-cd .tr-tip { padding: 8px 10px; border-left: 4px solid #fbbf24; background: color-mix(in srgb, #fbbf24 12%, var(--cd)); border-radius: 8px; font-size: 13px; }
      #tr-cd .tr-bar { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      #tr-cd .tr-bar .sp { flex: 1; font-size: 12px; color: var(--mu); }
      #bq { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 60; max-width: calc(100% - 24px); display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; background: var(--cd); color: var(--tx); border: 2px solid var(--crm); border-radius: 14px; box-shadow: 0 8px 30px #0006; }
      #t {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: var(--tx);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        display: none;
        max-width: 90%;
        z-index: 99;
      }
      #tp {
        position: fixed;
        z-index: 50;
        display: none;
        max-width: min(320px, 92vw);
        background: var(--cd);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.45;
        box-shadow: 0 8px 24px #0006;
        pointer-events: none;
      }
      #tp h4 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      .k {
        cursor: pointer;
      }
      .k:focus {
        outline: 2px solid var(--c);
      }
      footer {
        text-align: center;
        color: var(--mu);
        font-size: 12px;
        margin: 16px 0;
      }

      /* ===== Mejoras UI/UX ===== */
      html { scroll-behavior: smooth; scroll-padding-top: 130px; }
      ::selection { background: color-mix(in srgb, var(--ok) 35%, transparent); }
      button, .cd, .k, nav button { transition: background .15s, border-color .15s, box-shadow .15s, transform .1s, opacity .15s; }
      button:not(:disabled):hover { opacity: .88; }
      button:not(:disabled):active { transform: scale(.96); }

      function sell(cl, pid, q, from) {
        const p = P(pid);
        if (p.st < q) {

          const fn = (D.notes || []).find((n) => n.key == 'fail:' + cl + pid);
          if (fn) fn.pid = pid;
          done();
          return false;
        }
        p.st -= q;
        const base = p.pr * q,
          bf = benef(cl, pid),
          tot = bf ? Math.round(base * (100 - bf.pct)) / 100 : base,
          num = 'F-' + String((D.seq = (D.seq || D.sales.length) + 1)).padStart(4, '0');

        if (bf && bf.camp) {
          bf.camp.used = bf.camp.used || {};
          bf.camp.used[ck(cl)] = num;
          bf.camp.sent = bf.camp.sent || {};
          bf.camp.sent[ck(cl)] = bf.camp.sent[ck(cl)] || Date.now();
          bf.camp.resp = bf.camp.resp || {};
          bf.camp.resp[ck(cl)] = bf.camp.resp[ck(cl)] || { ts: Date.now() };
        }
        if (bf) toast('🎟️ Se aplicó ' + bf.pct + '% de descuento: ' + bf.why);
        note('erp', 'Nueva factura ' + num + ': ' + cl + ' compró ' + q + ' × ' + p.n + ' (' + fmt(tot) + (bf ? ', con ' + bf.pct + '% de descuento' : '') + '). El stock se descontó automáticamente.', 'crm', ['erp', 's-fact', 'r-f-' + num], 'sale:' + num);

        mark('r-i-' + pid, ['erp'], 'Se descontaron ' + q + ' pares de ' + esc(p.n) + ' por la venta a ' + esc(cl) + '. Quedan ' + p.st + '.');
        if (p.st <= p.min) mark('r-a-' + pid, ['scm'], 'Tras vender a ' + esc(cl) + ' quedan ' + p.st + ' pares de ' + esc(p.n) + ' (mínimo ' + p.min + '). Conviene pedir al proveedor.');
        log(from + ': ' + cl + ' compró ' + q + ' × ' + p.n + '. Se descontó del inventario y se emitió la factura ' + num + (bf ? ' (con ' + bf.pct + '% de descuento: ' + bf.why + ')' : ''), 'erp');
        if (p.st <= p.min) log('ERP → SCM: «Queda poco» de ' + p.n + ' (' + p.st + ' pares). Conviene pedir más al proveedor', 'scm');
        return true;
      }

                      return [`<span class="nm" tabindex="0" data-m="${esc(cmsg(c, r))}" onmouseenter="mtip(this)" onfocus="mtip(this)" onmouseleave="mtipx()" onblur="mtipx()" onclick="mtip(this)">${esc(r.n)} 💬</span>`, r.t ? '+591 ' + esc(r.t) : '—', u ? `<span class="b o" style="cursor:pointer" title="Ver la factura" onclick="fd('${u}')">🛒 Compró ${u} · ver</span>` : rs ? `<span class="b i" style="cursor:pointer" title="Ir a su tarjeta en el CRM" onclick="goto('crm','s-crm','l-${rs.lead}')">💬 Respondió · en CRM ↗</span>` : sn ? '<span class="b i">✅ Enviado</span>' : '<span class="b w">⏳ Pendiente</span>', `<div class="ic">${wa}<button class="gh sm" onclick="snt(${c.id},${i})">${sn ? '↺ Pendiente' : '✔ Enviado'}</button>${u ? '' : `<button class="gh sm" onclick="rsp(${c.id},${i})" title="Marca que el cliente contestó: pasa al CRM para atenderlo">${c.resp && c.resp[r.k] ? '↺ Quitar respuesta' : '💬 Respondió'}</button>`}<button class="gh sm" onclick="cpy(${c.id},${i})" title="Copiar mensaje">📋</button></div>`];
                    }),
                  )
                : '';
            return `<div class="cd cmp cc${c.col}${nvc('c-' + c.id)}" id="c-${c.id}"><div class="hd"><span><span class="cno">CAMPAÑA ${cs.indexOf(c) + 1}</span><b>${esc(c.n)}</b> <span class="b ${{ Activa: 'o', Vencida: 'w', Finalizada: '' }[st]}">${st}</span><br><small>${SEG[c.seg] ? SEG[c.seg][0] : ''} · ${p ? esc(p.n) : 'todos los productos'} · ${c.disc ? c.disc + '% dto' : 'sin descuento'} · hasta ${new Date(until(c)).toLocaleDateString('es-BO')}</small></span><span class="fm" style="margin:0">${st == 'Activa' && c.r.length ? `<button onclick="bulk(${c.id})">📨 Enviar a todos (${bqList(c).length})</button>` : ''}<button class="gh sm" onclick="tgl(${c.id})">${open ? 'Ocultar' : 'Ver'} destinatarios</button>${st == 'Activa' ? `<button class="gh sm" onclick="fin(${c.id})">Finalizar</button>` : ''}<button class="gh sm" onclick="dcamp(${c.id})">🗑️</button></span></div><div class="cpv"><small>📨 Esto es lo que se enviará · <b>[Nombre]</b> se cambia por el nombre de cada cliente · pasa el mouse por un cliente para ver su mensaje</small>${esc(c.msg ? cmsgG(c) : '')}</div><div class="mst">${tile('Destinatarios', s.n)}${tile('Enviados', s.sent + '/' + s.n)}${tile('Respondieron', s.resp + '/' + s.n)}${tile('Compraron', s.v + (s.n ? ' · ' + Math.round((s.v / s.n) * 100) + '%' : ''))}${tile('Vendido', fmt(s.ing))}${tile('Descuento dado', fmt(s.dto))}</div>${rec ? '<div class="rh">👥 Destinatarios de «' + esc(c.n) + '»</div>' : ''}${rec}<div class="cend">▲ FIN · Campaña ${cs.indexOf(c) + 1} de ${cs.length}: «${esc(c.n)}»</div></div>`;
          })
          .join('');
        const fr = flt(
          'fiel',
          cus,
          [
            ['b', TN[0], (x) => tier(x.tot) == 0],
            ['p', TN[1], (x) => tier(x.tot) == 1],
            ['o', TN[2], (x) => tier(x.tot) == 2],
            ['d', '😴 Dormidos', (x) => dago(x.last) > 60],
            ['camp', '📣 Compraron por campaña', (x) => D.sales.some((s) => s.camp && !s.v && ck(s.c) == x.k)],
            ['one', '🆕 Una sola compra', (x) => x.buys == 1],
            ['notel', '📵 Sin teléfono', (x) => !x.t],
          ],
          [
            ['tot', 'Mayor gasto primero', (a, b) => b.tot - a.tot],
            ['buys', 'Más compras primero', (a, b) => b.buys - a.buys],
            ['last', 'Compra más reciente', (a, b) => b.last - a.last],
            ['old', 'Más tiempo sin comprar', (a, b) => a.last - b.last],
            ['name', 'Nombre A-Z', (a, b) => a.n.localeCompare(b.n)],
          ],
          (x) => [x.n, x.c, x.t, TN[tier(x.tot)]].join(' '),
          'Buscar cliente, teléfono o ciudad…',
          [['city', 'Todas las ciudades', (a) => opt(a, (x) => [x.c, x.c]), (x, v) => x.c == v]],
        );
        const fid = cus.length
          ? fr.bar +
            (fr.list.length
              ? tb(
                  ['Cliente', 'Compras', 'Total gastado', 'Nivel', 'Beneficio', 'Prefiere', 'Última compra', 'Siguiente nivel', ''],
                  fr.list.map((x) => {
                    const t = tier(x.tot),
                      d = dago(x.last),
                      fv = Object.entries(x.fav).sort((a, b) => b[1] - a[1])[0],
                      fpd = fv && P(+fv[0]),
                      m = 'Hola ' + x.n.split(' ')[0] + ', gracias por ser parte de Zapatos Sol 💙 Eres cliente ' + tn(t) + (TB[t] ? ' y tienes ' + TB[t] + '% de descuento en tu próxima compra.' : '. Sigue comprando para subir de nivel y ganar descuentos.');
                    return [
                      esc(x.n) + (x.c ? '<br><small>📍 ' + esc(x.c) + '</small>' : ''),
                      x.buys,
                      fmt(x.tot),
                      TN[t],
                      TB[t] ? TB[t] + '% dto' : '—',
                      fpd ? pt(fpd) : '—',
                      (d == 0 ? 'Hoy' : 'hace ' + d + ' d') + (d > 60 ? ' <span class="b w">😴</span>' : ''),
                      t < 2 ? 'Faltan ' + fmt(TU[t + 1] - x.tot) + ' para ' + tn(t + 1) : 'Nivel máximo',
                      x.t ? `<div class="ic"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/591${esc(x.t)}?text=${encodeURIComponent(m)}">💬</a></div>` : '',
                    ];
                  }),
                )
              : none('fiel'))
          : '<p class="mu">Aún no hay clientes con compras. Vende desde el CRM para empezar a medir su fidelidad.</p>';
        return `${head}${nbn('mkt')}<div class="c" id="s-temp"><div class="hd"><h3>🗓️ Temporadas y fechas clave (Bolivia)</h3><button class="gh sm" onclick="MK.all=!MK.all;render()">${MK.all ? 'Ver solo las próximas' : 'Ver todo el año'}</button></div><p class="mu">Ordenadas por cercanía. Conviene lanzar la campaña al inicio de cada ventana, con el stock listo.</p><div class="kb">${sea}</div></div>
<div class="c" id="s-aud"><h3>🎯 Audiencias</h3><p class="mu">Se arman solas con tus clientes y tus interesados. Elige a quién hablarle.</p>${aus}</div>
<div class="c" id="s-camp"><div class="hd"><h3>📣 Campañas</h3><button onclick="nc()">+ Nueva campaña</button></div>${cs.length ? cf.bar + (cards || none('camp')) : '<p class="mu">Aún no hay campañas. Crea una desde una temporada o una audiencia.</p>'}</div>
<div class="c" id="s-fiel"><h3>🏆 Fidelización</h3><p class="mu">${TN[0]}: desde la primera compra · ${TN[1]}: desde ${fmt(TU[1])} (${TB[1]}% de descuento) · ${TN[2]}: desde ${fmt(TU[2])} (${TB[2]}% de descuento). El descuento se aplica solo al facturar; no se suma a las campañas, se usa el mayor.</p>${fid}</div>`;
      }
      function ds(id) {
        const s = S(id);
        if (D.prods.some((p) => p.sup == id)) {
          toast('No se puede eliminar: hay productos que dependen de este proveedor');
          return;
        }
        cf('¿Eliminar a ' + s.n + '?', () => {
          D.sups = D.sups.filter((x) => x.id != id);
          log('SCM: se eliminó al proveedor ' + s.n, 'scm');
          done();
        });
      }
      render();
    
      /* ===== Mejoras UI/UX ===== */
      (function () {
        const TABS = ['home', 'crm', 'mkt', 'erp', 'scm'], TK = 'zs_tab';
        // botón volver arriba
        const up = document.createElement('button');
        up.id = 'up'; up.textContent = '↑'; up.title = 'Volver arriba'; up.setAttribute('aria-label', 'Volver arriba');
        up.onclick = () => scrollTo({ top: 0 });
        document.body.appendChild(up);
        addEventListener('scroll', () => {
          up.classList.toggle('on', scrollY > 400);
          const st = $('.stk'); if (st) st.classList.toggle('sc', scrollY > 10);
        }, { passive: true });
        document.querySelectorAll('nav button').forEach((b) => b.setAttribute('role', 'tab'));
        const nv = $('nav'); if (nv) nv.setAttribute('role', 'tablist');
        // render mejorado: conserva scroll y foco, ARIA y contador en el título
        const _r = render;
        render = function () {
          const y = scrollY, a = document.activeElement, v = $('#v');
          const idx = a && v && v.contains(a) && /INPUT|SELECT/.test(a.tagName) ? [...v.querySelectorAll('input,select')].indexOf(a) : -1;
          const pos = idx >= 0 && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
          const same = render.last === T; render.last = T;
          _r();
          { const bar = v.querySelector('.al.nvh'), sp = v.querySelector('.nvsp'); if (bar && sp) { v.prepend(bar); v.prepend(sp); nvUp(); } }
          if (same) scrollTo({ top: y, behavior: 'instant' });
          if (idx >= 0) { const n = v.querySelectorAll('input,select')[idx]; if (n) { n.focus(); if (pos) try { n.setSelectionRange(pos[0], pos[1]); } catch (_) {} } }
          document.querySelectorAll('#v .cd .wn:not(.ok)').forEach((w) => {
            const t = (w.querySelector('b') || {}).textContent || 'Aviso', body = document.createElement('div'), hd = document.createElement('button');
            body.className = 'wnb';
            while (w.firstChild) body.appendChild(w.firstChild);
            hd.className = 'wnt';
            hd.innerHTML = '⚠️ ' + t + ' <u>ver opciones ▾</u>';
            hd.onclick = () => w.classList.toggle('open');
            w.append(hd, body);
          });
          const ls = $('#lv'); if (ls) ls.value = LV;
          document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-selected', b.dataset.t == T));
          const pend = [...document.querySelectorAll('nav .nb')].reduce((n, b) => n + (parseInt(b.textContent.replace(/\D/g, '')) || 0), 0);
          document.title = (pend ? '(' + pend + ') ' : '') + 'Zapatos Sol — CRM · ERP · SCM';
          try { localStorage.setItem(TK, T); } catch (_) {}
        };
        // diálogos: foco inicial y cerrar al tocar fuera
        new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((d) => {
          if (d.tagName != 'DIALOG') return;
          setTimeout(() => { const f = d.querySelector('input,select') || d.querySelector('button[type=submit]'); if (f) f.focus(); });
          d.addEventListener('mousedown', (e) => { if (e.target === d) d.dispatchEvent(new Event('cancel')); });
        }))).observe(document.body, { childList: true });
        // aviso: accesible y se cierra al tocarlo
        const t = $('#t'); if (t) { t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); t.onclick = () => (t.style.display = 'none'); }
        // recordar la última pestaña
        let sv = null; try { sv = localStorage.getItem(TK); } catch (_) {}
        if (sv && TABS.includes(sv) && sv != T) go(sv); else render();
        // primera visita: ofrecer el tour una sola vez
        try { if (!localStorage.getItem('zs_tour')) setTimeout(tour, 700); } catch (_) {}
      })();
    </script>
  </body>
