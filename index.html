<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Demo CRM · ERP · SCM — Zapatos Sol</title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        --bg: #f4f5fa;
        --cd: #fff;
        --tx: #1b1e2b;
        --mu: #5b6075;
        --bd: #e0e3ee;
        --crm: #2563eb;
        --scm: #c2410c;
        --erp: #0f766e;
        --ok: #15803d;
        --wr: #b45309;
        --rd: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1120;
          --cd: #181c2f;
          --tx: #eef0f8;
          --mu: #a3a9c4;
          --bd: #2a3050;
          --crm: #60a5fa;
          --scm: #fb923c;
          --erp: #2dd4bf;
          --ok: #4ade80;
          --wr: #fbbf24;
          --rd: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .w {
        max-width: 1100px;
        margin: 0 auto;
        padding: 14px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      .mu,
      small {
        color: var(--mu);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 0 0 8px;
      }
      nav button {
        border: 1px solid var(--bd);
        background: var(--cd);
        color: var(--tx);
        border-radius: 99px;
        padding: 8px 16px;
        font-size: 14px;
      }
      nav button.on {
        background: var(--tx);
        color: var(--bg);
        font-weight: 700;
      }
      .c {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .c h2 {
        margin: 0 0 6px;
        font-size: 18px;
      }
      .c h3 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .c p {
        margin: 4px 0;
      }
      .c.crm {
        border-top: 5px solid var(--crm);
      }
      .c.erp {
        border-top: 5px solid var(--erp);
      }
      .c.scm {
        border-top: 5px solid var(--scm);
      }
      .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .hd h3 {
        margin: 0;
      }
      .stk {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        margin: 0 -14px 12px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--bd);
      }
      .kp {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .k {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-left: 5px solid var(--c);
        border-radius: 12px;
        padding: 6px 10px;
        flex: 0 0 auto;
        min-width: 125px;
      }
      .k small {
        display: block;
        font-size: 12px;
        white-space: nowrap;
      }
      .k b {
        display: block;
        font-size: 17px;
        white-space: nowrap;
      }
      .k.crm {
        --c: var(--crm);
      }
      .k.erp {
        --c: var(--erp);
      }
      .k.scm {
        --c: var(--scm);
      }
      .kb {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
        gap: 10px;
      }
      .col {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px;
      }
      .col h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--crm);
      }
      .cd {
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 8px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .cd b {
        font-size: 14px;
      }
      .cd > button {
        margin-top: 6px;
        width: 100%;
      }
      .ic {
        display: flex;
        gap: 4px;
        margin-top: 6px;
      }
      .ic button {
        flex: 1;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th,
      td {
        border-bottom: 1px solid var(--bd);
        padding: 7px 8px;
        text-align: left;
        white-space: nowrap;
      }
      th {
        color: var(--mu);
      }
      .b {
        border-radius: 99px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 700;
      }
      .b.w {
        background: #f59e0b33;
        color: var(--wr);
      }
      .b.o {
        background: #22c55e33;
        color: var(--ok);
      }
      button:not(nav button) {
        background: var(--tx);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      button.gh {
        background: transparent;
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      button.sm {
        padding: 3px 8px;
        font-size: 12px;
        margin-right: 4px;
      }
      .fm {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .al {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        border: 1px solid var(--wr);
        border-radius: 10px;
        padding: 8px 10px;
        margin-bottom: 8px;
      }
      .pt {
        display: inline-block;
        border-left: 4px solid var(--pc);
        background: color-mix(in srgb, var(--pc) 18%, transparent);
        padding: 0 7px;
        border-radius: 6px;
        font-weight: 600;
      }
      .b.r {
        background: #ef444433;
        color: var(--rd);
      }
      .al.r {
        border-color: var(--rd);
      }
      .al small {
        display: block;
      }
      .al .bt {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      [id^='s-'],
      [id^='l-'],
      [id^='r-'] {
        scroll-margin-top: 150px;
      }
      .fl {
        animation: fl 1.8s;
      }
      tr.fl-r td {
        animation: flr 3.6s;
      }
      @keyframes flr {
        0%,
        75% {
          background: color-mix(in srgb, var(--wr) 45%, transparent);
        }
        100% {
          background: transparent;
        }
      }
      @keyframes fl {
        0%,
        65% {
          box-shadow: 0 0 0 3px var(--wr);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .wn {
        border: 1px solid var(--wr);
        background: #f59e0b1f;
        border-radius: 8px;
        padding: 6px 8px;
        margin-top: 6px;
        font-size: 12px;
      }
      .wn.ok,
      .al.ok {
        border-color: var(--ok);
        background: #22c55e1f;
      }
      .nvb {
        display: inline-block;
        background: var(--ok);
        color: var(--bg);
        border-radius: 6px;
        padding: 0 5px;
        font-size: 11px;
        font-weight: 800;
        margin-right: 4px;
      }
      tr.nv td {
        background: color-mix(in srgb, var(--ok) 13%, transparent);
      }
      tr.nv td:first-child {
        box-shadow: inset 4px 0 0 var(--ok);
      }
      .cd.nv,
      .al.nv {
        box-shadow: 0 0 0 2px var(--ok);
      }
      .flash:not(tr) {
        animation: fl 1.8s;
      }
      tr.flash td {
        animation: flr 3.6s;
      }
      .al.nvh {
        position: fixed;
        top: var(--nvtop, 120px);
        left: 50%;
        transform: translateX(-50%);
        width: min(1072px, calc(100vw - 20px));
        z-index: 6;
        margin: 0;
        padding: 7px 10px;
        border-color: var(--ok);
        background: color-mix(in srgb, var(--ok) 18%, var(--bg));
        box-shadow: 0 4px 16px #0008, 0 0 0 1px var(--ok);
        cursor: pointer;
        flex-wrap: nowrap;
      }
      .nvsp {
        height: var(--nvh, 52px);
      }
      .al.nvh:hover {
        background: color-mix(in srgb, var(--ok) 26%, var(--bg));
      }
      .al.nvh > span {
        min-width: 0;
      }
      .al.nvh small {
        display: inline;
        margin-left: 6px;
        opacity: 0.8;
      }
      .al.nvh .bt {
        flex-wrap: nowrap;
        flex: none;
      }
      .nvh .nvc {
        font-weight: 800;
        color: var(--ok);
        margin-left: 4px;
      }
      .nv.nvcur {
        outline: 3px solid var(--ok);
        outline-offset: 2px;
        border-radius: 8px;
      }
      tr.nv.nvcur td {
        background: color-mix(in srgb, var(--ok) 30%, transparent);
      }
      @media (max-width: 640px) {
        .al.nvh {
          flex-wrap: wrap;
        }
        .al.nvh small {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
      .tl {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin: 0 0 10px;
      }
      .tl input,
      .tl select {
        width: auto;
        margin: 0;
        padding: 6px 10px;
        font-size: 13px;
        flex: 0 1 auto;
      }
      .tl input {
        min-width: 190px;
        flex: 1 1 190px;
      }
      .c.tlc {
        padding: 10px 14px 0;
        margin-bottom: 10px;
      }
      button.ch {
        background: transparent;
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 99px;
        padding: 4px 11px;
        font-size: 12px;
        font-weight: 600;
      }
      button.ch b {
        opacity: 0.7;
        margin-left: 2px;
      }
      button.ch.on {
        background: var(--tx);
        color: var(--bg);
      }
      .al[onclick] {
        cursor: pointer;
      }
      .nb {
        background: var(--ok);
        color: var(--bg);
        border-radius: 99px;
        padding: 0 7px;
        font-size: 12px;
        font-weight: 800;
        margin-left: 4px;
      }
      .wn button {
        margin-top: 6px;
        width: 100%;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .b.i {
        background: #3b82f633;
        color: var(--crm);
      }
      .ks {
        display: block;
        font-size: 11px;
        color: var(--mu);
        white-space: nowrap;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nw {
        display: none;
        border-left: 3px solid var(--erp);
        padding-left: 8px;
        margin-top: 4px;
      }
      .lg {
        display: flex;
        gap: 8px;
        padding: 6px 0 6px 8px;
        border-bottom: 1px solid var(--bd);
        border-left: 4px solid var(--c);
        font-size: 13px;
      }
      .lg i {
        font-style: normal;
        color: var(--mu);
        flex: none;
      }
      .lg.crm {
        --c: var(--crm);
      }
      .lg.erp {
        --c: var(--erp);
      }
      .lg.scm {
        --c: var(--scm);
      }
      ol {
        margin: 6px 0;
        padding-left: 20px;
      }
      li {
        margin: 4px 0;
      }
      dialog {
        border: 1px solid var(--bd);
        border-radius: 14px;
        background: var(--cd);
        color: var(--tx);
        padding: 16px;
        width: min(420px, 92vw);
      }
      dialog::backdrop {
        background: #0008;
      }
      dialog h3 {
        margin: 0 0 6px;
      }
      label {
        display: block;
        margin: 8px 0;
        font-size: 13px;
        color: var(--mu);
      }
      input,
      select {
        font: inherit;
        display: block;
        width: 100%;
        margin-top: 3px;
        padding: 8px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--bg);
        color: var(--tx);
      }
      .ac {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      #t {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: var(--tx);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        display: none;
        max-width: 90%;
        z-index: 99;
      }
      #tp {
        position: fixed;
        z-index: 50;
        display: none;
        max-width: min(320px, 92vw);
        background: var(--cd);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.45;
        box-shadow: 0 8px 24px #0006;
        pointer-events: none;
      }
      #tp h4 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      .k {
        cursor: pointer;
      }
      .k:focus {
        outline: 2px solid var(--c);
      }
      footer {
        text-align: center;
        color: var(--mu);
        font-size: 12px;
        margin: 16px 0;
      }

      /* ===== Mejoras UI/UX ===== */
      html { scroll-behavior: smooth; scroll-padding-top: 130px; }
      ::selection { background: color-mix(in srgb, var(--ok) 35%, transparent); }
      button, .cd, .k, nav button { transition: background .15s, border-color .15s, box-shadow .15s, transform .1s, opacity .15s; }
      button:not(:disabled):hover { opacity: .88; }
      button:not(:disabled):active { transform: scale(.96); }
      button:focus-visible, input:focus-visible, select:focus-visible, .k:focus-visible, .al[onclick]:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--crm) 75%, white); outline-offset: 2px; }
      input:focus, select:focus { border-color: var(--crm); box-shadow: 0 0 0 3px color-mix(in srgb, var(--crm) 25%, transparent); outline: none; }
      nav button:not(.on):hover { border-color: var(--tx); }
      .stk { transition: box-shadow .2s; }
      .stk.sc { box-shadow: 0 6px 18px #0006; }
      .cd:hover { border-color: color-mix(in srgb, var(--tx) 35%, var(--bd)); box-shadow: 0 3px 10px #0004; }
      .k:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #0004; }
      tr:not(:first-child):hover td { background: color-mix(in srgb, var(--tx) 6%, transparent); }
      tr.nv:hover td { background: color-mix(in srgb, var(--ok) 20%, transparent); }
      th { position: sticky; top: 0; background: var(--cd); }
      button:disabled { cursor: not-allowed; }
      #t { cursor: pointer; box-shadow: 0 8px 24px #0007; animation: tin .25s; }
      @keyframes tin { from { opacity: 0; translate: 0 12px; } }
      dialog { border-radius: 14px; animation: tin .2s; }
      dialog::backdrop { background: #0009; backdrop-filter: blur(3px); }
      #up { position: fixed; right: 14px; bottom: 14px; width: 42px; height: 42px; border-radius: 50% !important; padding: 0 !important;
        font-size: 18px !important; box-shadow: 0 4px 14px #0007; z-index: 30; opacity: 0; pointer-events: none; }
      #up.on { opacity: .92; pointer-events: auto; }
      @media (max-width: 640px) {
        nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
        nav button { flex: none; white-space: nowrap; }
        h1 { font-size: 19px; }
      }
      @media (pointer: coarse) { button:not(.sm) { min-height: 40px; } button.sm { min-height: 34px; } }

      /* ===== Responsive ===== */
      .tw { background: linear-gradient(to right, var(--cd) 30%, transparent) left, linear-gradient(to left, var(--cd) 30%, transparent) right,
        radial-gradient(farthest-side at 0 50%, #0006, transparent) left, radial-gradient(farthest-side at 100% 50%, #0006, transparent) right;
        background-repeat: no-repeat; background-size: 28px 100%, 28px 100%, 10px 100%, 10px 100%; background-attachment: local, local, scroll, scroll; }
      dialog { max-height: 92vh; overflow-y: auto; }
      @media (max-width: 900px) {
        .kb { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      }
      @media (max-width: 640px) {
        .w { padding: 10px; }
        .top > button { width: 100%; }
        .top small { display: block; font-size: 12px; }
        .stk { margin: 0 -10px 10px; padding: 6px 10px; }
        .kp { scroll-snap-type: x proximity; margin: 0 -10px; padding: 0 10px 4px; }
        .k { scroll-snap-align: start; min-width: 108px; padding: 5px 8px; }
        .k b { font-size: 15px; }
        .c { padding: 12px; border-radius: 12px; }
        .c h2 { font-size: 16px; }
        .kb { grid-template-columns: 1fr; }
        .hd > button, .fm > button { flex: 1 1 100%; }
        .ic button { min-height: 38px; }
        th, td { padding: 6px; font-size: 12px; }
        .tl input, .tl select { flex: 1 1 100%; min-width: 0; }
        input, select { font-size: 16px; }
        dialog { width: 96vw; padding: 14px; }
        .ac { flex-direction: column-reverse; }
        .ac button { width: 100%; }
        #t { width: 92vw; max-width: 92vw; text-align: center; bottom: 70px; }
        #up { bottom: 14px; right: 10px; }
        .al.nvh { padding: 6px 8px; font-size: 13px; }
        .al.nvh .bt { width: 100%; }
        .al.nvh .bt button { flex: 1; }
      }
      @media (max-width: 380px) { h1 { font-size: 17px; } nav button { padding: 7px 12px; font-size: 13px; } }
      .al.ok[onclick]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--bg)); }
      tr.fl-r td { background: color-mix(in srgb, var(--wr) 38%, transparent) !important; box-shadow: inset 0 2px 0 var(--wr), inset 0 -2px 0 var(--wr); }

      /* ===== CRM mejorado ===== */
      .rs { display: flex; gap: 6px; align-items: center; }
      .rs select { width: auto; margin: 0; padding: 7px 8px; font-size: 13px; }
      .cd .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
      .dot.d-r { background: var(--rd); } .dot.d-w { background: var(--wr); } .dot.d-g { background: var(--ok); }
      .cd .ic { flex-wrap: wrap; } .cd .ic button, .cd .ic a.btn { flex: 1 1 auto; min-width: 0; }
      .col h3 small { font-weight: 400; margin-left: 4px; }
      .cd .b { margin-top: 3px; display: inline-block; }
      .ic a.btn { flex: 1; text-align: center; text-decoration: none; color: var(--tx); border: 1px solid var(--bd); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 600; }
      .ic a.btn:hover { background: color-mix(in srgb, var(--tx) 8%, transparent); }
      .wn:not(.open) .wnb { display: none; }
      .wn .wnt { width: 100%; text-align: left; background: transparent; border: 0; padding: 0; color: var(--wr); font-size: 12px; font-weight: 600; }
      .wn .wnt u { opacity: .8; margin-left: 4px; }
      .wn.open .wnt { margin-bottom: 6px; }
      @media (max-width: 640px) { .rs { width: 100%; } .rs select { flex: 1; min-width: 0; } .top > .rs button { width: auto; } }
    </style>
  </head>
  <body>
    <div class="w">
      <div class="top">
        <div>
          <h1>🛍️ Zapatos Sol — Demo CRM · ERP · SCM</h1>
          <small>Tienda ficticia de calzado en Bolivia. Funciona en tu navegador, sin base de datos.</small>
        </div>
        <div class="rs"><select id="lv" onchange="setLv(this.value)" title="Datos con los que arranca la demo" aria-label="Datos de la demo"><option value="min">Datos muy básicos</option><option value="bas">Datos básicos</option><option value="med">Datos medios</option><option value="adv">Datos avanzados</option></select><button onclick="rst()" title="Restaura la demo con los datos seleccionados">↺ Reiniciar demo</button></div>
      </div>
      <div class="stk">
        <nav>
          <button
            data-t="home"
            onclick="go('home')"
          >
            📋 Bitácora</button
          ><button
            data-t="crm"
            onclick="go('crm')"
          >
            👥 CRM (clientes)</button
          ><button
            data-t="erp"
            onclick="go('erp')"
          >
            🏢 ERP (empresa)</button
          ><button
            data-t="scm"
            onclick="go('scm')"
          >
            🚚 SCM (proveedores)
          </button>
        </nav>
        <div
          class="kp"
          id="kp"
        ></div>
      </div>
      <main id="v"></main>
      <footer id="ft"></footer>
    </div>
    <input
      id="imp"
      type="file"
      accept=".json,application/json"
      hidden
      onchange="im(this)"
    />
    <div id="t"></div>
    <div id="tp"></div>
    <script>
      const KEY = 'zapatos_sol_demo_v1',
        ST = ['Nuevo', 'Contactado', 'Precio enviado', 'Vendido', 'Perdido'],
        CITIES = ['La Paz', 'El Alto', 'Cochabamba', 'Santa Cruz', 'Sucre', 'Tarija', 'Potosí', 'Oruro', 'Trinidad', 'Cobija'],
        OS = ['Esperando envío', 'En camino', 'Recibido'],

        };
        // diálogos: foco inicial y cerrar al tocar fuera
        new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((d) => {
          if (d.tagName != 'DIALOG') return;
          setTimeout(() => { const f = d.querySelector('input,select') || d.querySelector('button[type=submit]'); if (f) f.focus(); });
          d.addEventListener('mousedown', (e) => { if (e.target === d) d.dispatchEvent(new Event('cancel')); });
        }))).observe(document.body, { childList: true });
        // aviso: accesible y se cierra al tocarlo
        const t = $('#t'); if (t) { t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); t.onclick = () => (t.style.display = 'none'); }
        // recordar la última pestaña
        let sv = null; try { sv = localStorage.getItem(TK); } catch (_) {}
        if (sv && TABS.includes(sv) && sv != T) go(sv); else render();
      })();
    </script>
  </body>
</html>
